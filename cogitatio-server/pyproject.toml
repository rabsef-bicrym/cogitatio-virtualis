[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cogitatio"
version = "0.1.0"
description = "Cogitatio Virtualis Backend Server"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.1",
    "pydantic==2.13.3",
    "uvicorn[standard]==0.46.0",
    "gunicorn==25.3.0",
    "python-dotenv==1.2.2",
    "voyageai==0.3.7",
    "faiss-cpu==1.13.2",
    "numpy==2.4.4",
    "python-multipart==0.0.27",
    "SQLAlchemy==2.0.49",
    "PyYAML==6.0.3",
    "watchdog==6.0.0",
    "tabulate==0.9.0",
    "scikit-learn==1.8.0",
    "Flask==3.1.2",
    "plotly==6.7.0"
]

[project.optional-dependencies]
publish = [
    "psycopg[binary]==3.3.1",
]
test = [
    "build==1.3.0",
    "pytest==9.0.2"
]

[project.scripts]
cogitatio-server = "scripts.start_server:main"

[tool.hatch.build.targets.wheel]
packages = ["cogitatio", "scripts"]
