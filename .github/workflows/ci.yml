name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: virtualis-terminal
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: virtualis-terminal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run frontend gate
        env:
          DATABASE_URL: file:./prisma/dev.db
          VECTOR_API_URL: http://127.0.0.1:8000
        run: npm run check

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cogitatio-server
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Check Python dependencies
        run: python -m pip check

      - name: Run backend tests
        run: python -m pytest cogitatio/tests -q

      - name: Compile backend modules
        run: python -m compileall -q cogitatio scripts

      - name: Build backend package
        run: python -m build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Prepare SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/lightsail_cd
          chmod 600 ~/.ssh/lightsail_cd
          printf '%s\n' "${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy production
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          GIT_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/lightsail_cd \
            -o IdentitiesOnly=yes \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "set -e; cd /home/ubuntu/cogitatio-virtualis && if [ ! -x admin/deploy-production.sh ]; then git fetch origin master && git checkout master && git pull --ff-only origin master; fi && bash admin/deploy-production.sh $GIT_SHA"
